<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>EventSphere</title>
  <script>
    var l = window.location;
    var base = '/eventsphere';
    var path = l.pathname.replace(base, '') || '/';
    var search = l.search;
    var hash = l.hash;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      base + '/?p=' + encodeURIComponent(path + search) +
      hash
    );
  </script>
</head>
<body></body>
</html>
